<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroIntel // System Access Gateway</title>
    <meta name="description" content="Secure login portal for AeroIntel Air Quality and Environmental Health Intelligence Platform.">

    <!-- Brand Favicons & App Manifest -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}?v=2.6">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}?v=2.6">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}?v=2.6">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}?v=2.6">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}?v=2.6">
    <meta name="theme-color" content="#07090E">

    <!-- Fonts: Inter & Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['Outfit', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        obsidian: {
                            950: '#07090E',
                            900: '#0B0E17',
                            850: '#101420',
                            800: '#161B2A',
                            750: '#1D2336',
                            700: '#262E44',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            color-scheme: dark;
        }
        body {
            background-color: #07090E;
            color: #F1F5F9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .login-card {
            background: rgba(16, 20, 32, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 1.5rem;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.85), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden bg-obsidian-950">

    <!-- Ambient Dynamic Glow Backdrop -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:32px_32px] opacity-20"></div>
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] bg-amber-500/10 rounded-full blur-[160px] pointer-events-none"></div>
        <div class="absolute bottom-10 right-1/4 w-[500px] h-[500px] bg-sky-600/10 rounded-full blur-[180px] pointer-events-none"></div>
    </div>

    <!-- Login Gateway Container -->
    <div class="relative z-10 w-full max-w-md">
        <div class="login-card p-7 sm:p-9 relative">
            
            <!-- Header Icon & Branding -->
            <div class="flex flex-col items-center text-center mb-6">
                <div class="w-13 h-13 p-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-3xl mb-3.5 shadow-[0_0_24px_rgba(245,158,11,0.25)]">
                    <i class="ph-bold ph-shield-check"></i>
                </div>
                <h1 class="font-heading font-black text-2xl text-white tracking-tight">AeroIntel Access Gateway</h1>
                <p class="text-xs text-slate-400 mt-1 max-w-xs leading-relaxed">Authenticate to access real-time atmospheric telemetry and prediction engine</p>
                <div class="mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/[0.04] border border-white/10 text-[10px] font-mono text-slate-400">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <span>Protected Operational Environment</span>
                </div>
            </div>

            <!-- Error Banner (Flask flash / JS error) -->
            <div id="auth-error-msg" class="{% if not error %}hidden{% endif %} mb-4 text-xs text-rose-300 font-mono p-3 rounded-xl bg-rose-500/15 border border-rose-500/30 text-center flex items-center justify-center gap-2">
                <i class="ph-bold ph-warning-circle text-rose-400 text-sm shrink-0"></i>
                <span id="auth-error-text">{{ error or '' }}</span>
            </div>

            <!-- Authentication Form -->
            <form id="auth-form" method="POST" action="/login" class="flex flex-col gap-4">
                
                <!-- Username -->
                <div>
                    <label for="auth-username" class="block text-xs font-mono text-slate-300 font-semibold mb-1.5 flex items-center justify-between">
                        <span>Operator Username</span>
                        <span class="text-[10px] text-slate-500 font-normal">default: admin</span>
                    </label>
                    <div class="relative flex items-center">
                        <i class="ph-bold ph-user absolute left-3.5 text-slate-500 text-xs pointer-events-none"></i>
                        <input type="text"
                               id="auth-username"
                               name="username"
                               value="admin"
                               autocomplete="username"
                               required
                               class="w-full bg-obsidian-950 border border-white/10 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white font-mono outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder:text-slate-600">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="auth-password" class="block text-xs font-mono text-slate-300 font-semibold mb-1.5 flex items-center justify-between">
                        <span>Operator Password</span>
                        <span class="text-[10px] text-slate-500 font-normal">default: admin123</span>
                    </label>
                    <div class="relative flex items-center">
                        <i class="ph-bold ph-lock-key absolute left-3.5 text-slate-500 text-xs pointer-events-none"></i>
                        <input type="password"
                               id="auth-password"
                               name="password"
                               value="admin123"
                               autocomplete="current-password"
                               required
                               class="w-full bg-obsidian-950 border border-white/10 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white font-mono outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder:text-slate-600">
                    </div>
                </div>

                <!-- API Access Token Alternative -->
                <div class="pt-0.5">
                    <label for="auth-token" class="block text-[11px] text-slate-400 font-mono mb-1">
                        Or API Access Token (.env)
                    </label>
                    <div class="relative flex items-center">
                        <i class="ph-bold ph-key absolute left-3.5 text-slate-500 text-xs pointer-events-none"></i>
                        <input type="password"
                               id="auth-token"
                               name="token"
                               placeholder="Optional .env access token"
                               class="w-full bg-obsidian-950 border border-white/10 rounded-xl pl-9 pr-3.5 py-2 text-xs text-white font-mono outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder:text-slate-600">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        id="btn-submit-auth"
                        class="w-full mt-2 py-3.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-obsidian-950 font-heading font-extrabold text-xs tracking-wider uppercase transition-all duration-200 shadow-[0_0_22px_rgba(245,158,11,0.35)] hover:shadow-[0_0_30px_rgba(245,158,11,0.55)] cursor-pointer active:scale-[0.99] flex items-center justify-center gap-2">
                    <i class="ph-bold ph-sign-in text-base"></i>
                    <span>Authenticate & Enter System</span>
                </button>

                <!-- Footer Hint -->
                <div class="text-center text-[10px] font-mono text-slate-500 pt-1">
                    Configured via project <code class="text-slate-400">.env</code> credentials
                </div>
            </form>

        </div>
    </div>

    <!-- Client-side Fast Login Script -->
    <script>
        const authForm = document.getElementById('auth-form');
        const authErrorMsg = document.getElementById('auth-error-msg');
        const authErrorText = document.getElementById('auth-error-text');
        const btnSubmit = document.getElementById('btn-submit-auth');

        if (authForm) {
            authForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (authErrorMsg) authErrorMsg.classList.add('hidden');

                const origHtml = btnSubmit.innerHTML;
                btnSubmit.innerHTML = `<i class="ph-bold ph-spinner animate-spin text-base"></i><span>Verifying Access...</span>`;
                btnSubmit.disabled = true;

                const username = document.getElementById('auth-username').value.trim();
                const password = document.getElementById('auth-password').value.trim();
                const token = document.getElementById('auth-token').value.trim();

                try {
                    const res = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password, token })
                    });

                    const data = await res.json();
                    if (data.success) {
                        btnSubmit.innerHTML = `<i class="ph-bold ph-check text-base"></i><span>Access Granted! Entering...</span>`;
                        window.location.href = data.redirect || '/';
                    } else {
                        if (authErrorText) authErrorText.textContent = data.error || 'Invalid credentials. Please verify your credentials.';
                        if (authErrorMsg) authErrorMsg.classList.remove('hidden');
                        btnSubmit.innerHTML = origHtml;
                        btnSubmit.disabled = false;
                    }
                } catch (err) {
                    // Fallback to standard form submit
                    authForm.submit();
                }
            });
        }
    </script>
</body>
</html>
